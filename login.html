<!doctype html>
<html lang="en" class="fullscreen-bg">

<head>
    <title>Sistem Informasi CAT - Biro Kepegawaian - Kementerian Pertahanan</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    
	<link rel="icon" href="assets/img/logo-kemhan.png">
    <link rel="stylesheet" href="vendor/bootstrap-v4/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/font-awesome-5/css/all.min.css">
    <link rel="stylesheet" href="assets/css/roboto.min.css?_dc=1662000000">
    <link rel="stylesheet" href="assets/css/tinymce.css?_dc=1662000000">
    <link rel="stylesheet" href="assets/css/custom.min.css?_dc=1662000000">
</head>

<body>
    <div class="wrapper">
		<div class="bg">&nbsp;</div>
		<div class="container">
			<div class="header">
				<div class="logo logo-center">
					<img src="assets/img/logo-kemhan.png">
					<div>
						<h2>BIRO KEPEGAWAIAN</h2>
						<h2>KEMENTERIAN PERTAHANAN RI</h2>
						<h6>CAT Kemhan</h6>
					</div>
				</div>
			</div>
			<div class="card login">
				<div class="card-body">
					<h4>Selamat Datang</h4>
					
					<!--
					<div class="rounded my-2 text-center">
						<div class="webcam" id="webcam-image" style="margin: auto; border-radius: 10px;overflow:hidden;"></div>
					</div>
					-->	
					<p class="mt-4">Silahkan <!--aktifkan webcam Anda kemudian--> login dengan username dan password yang Anda miliki</p>

					<form class="auth-form" id="fmLogin" name="fmLogin" method="POST" action="api/v1/login">
						<div class="form-label-group">
							<span class="fa fa-user"></span>
							<input autofocus="" class="form-control" id="username" placeholder="Username" required type="text" id="username" name="username"/>
							<span class="line"></span>
							<label for="username">Username</label>
						</div>
						<div class="form-label-group">
							<span class="fa fa-lock"></span>
							<input class="form-control" id="password" placeholder="Password" required type="password" id="password" name="password"/>
							<span class="line"></span>
							<label for="password"/>Password</label>
							<span class="fa fa-eye" id="btnEye"></span>
						</div>
						<button class="btn btn-lg btn-primary btn-block" type="button" id="btnLogin">Login <div class="spinner-border spinner-border-sm" role="status"></div></button><br><br>
						<a href="javascript:;" tabindex="5" data-toggle="modal" data-target="#lupaPassModal">Lupa Password ?</a>					</form>
				</div>
				<div class="card-footer text-center">
					<!--Helpdesk : <strong>082237837543</strong>-->
					Kementerian Pertahanan &copy; 2022
				</div>
			</div>
		</div>
    </div>

	<div class="modal fade" id="lupaPassModal" tabindex="-1" role="dialog" aria-labelledby="lupaPassLabel" aria-hidden="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h6 class="modal-title" id="lupaPassLabel">Lupa Password</h6>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<input type="text" class="form-control form-control-sm" name="lupa_email" id="lupa_email" placeholder="Email Yang Terdaftar">
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Tutup</button>
					<button type="button" class="btn btn-primary btn-sm" id="btnLupa">Kirim</button>
				</div>
			</div>
		</div>
	</div>

    <script>
	    var baseURL = '';
	    var uniqueID = 'STATIC-UI-KIT-NO-LIVE-KEY';
	</script>

	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="vendor/jquery/jquery.form.min.js"></script>
	<script src="vendor/bootstrap-v4/js/bootstrap.min.js"></script>
	<script src="vendor/webcam/webcam.min.js"></script>
	<script src="assets/js/custom.min.js?_dc=1662000000"></script>
		<script>
		$('#btnLupa').click(function(){
			$.ajax({
				url: baseURL + 'api/v1/lupa',
				method: 'POST',
				dataType: 'json',
				data: { email: $('#lupa_email').val() },
				success: function(a) {
					if (a.success) {
						app.notify(a.msg, 'success')
						$('#lupaPassModal').modal('hide')
					} else {
						app.notify(a.msg, 'danger')
					}
				}
			});
		});
	</script>
    </body>

</html>
